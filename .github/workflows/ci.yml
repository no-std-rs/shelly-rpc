name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Check CLI entrypoints
        run: |
          cargo run --locked -p shellyctl -- --help
          cargo run --locked -p shellyctl -- script shelly.invalid upload --help
          cargo run --locked -p shellyctl -- completions bash | head -n 5
      - name: Verify distributable crates
        run: cargo package --locked --workspace

  no-std:
    name: Embedded no_std build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          key: embedded
      - run: cargo check --locked -p shelly-rpc --no-default-features --target thumbv7em-none-eabihf
