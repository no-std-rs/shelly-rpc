name: Publish crates

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publishing
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release identity
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag does not match the workspace version')
          PY
      - run: cargo test --locked --workspace
      - run: cargo package --locked --workspace
      - name: Publish library, then CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo 'CARGO_REGISTRY_TOKEN is not configured' >&2; exit 1; }
          python3 scripts/publish_crates.py
